name: Deploy to Server
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploying via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        command_timeout: 5m
        script: |
          cd ~/VIDO
          git pull origin main
          
          # Backend — avval o'rnatib, vaqtincha to'xtatamiz (RAM bo'shatish uchun)
          cd backend
          npm install
          
          # Frontend — build paytida RAM kam bo'lishi mumkin, shuning uchun
          # backendni to'xtatib, NODE xotirasini cheklab build qilamiz
          cd ../frontend
          npm install
          pm2 stop vido-backend || true
          NODE_OPTIONS="--max-old-space-size=512" npm run build
          
          # Backend — qayta ishga tushiramiz
          pm2 restart vido-backend
